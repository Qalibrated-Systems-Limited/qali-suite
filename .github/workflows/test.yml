# ============================================
# CI — runs the test suite on every push + PR
# ============================================
#
# What this does:
#   - On every push to main and every pull request, spin up an Ubuntu
#     VM with an empty Postgres, install Node + npm deps, lint, apply
#     the migrations from scratch, then run `npm test`.
#   - If lint finds an ERROR (or any test fails), the PR is marked ✗ and
#     (with branch protection enabled — see README) merging is blocked.
#
# Why this file lives in .github/workflows/:
#   GitHub Actions auto-discovers any YAML file in that directory and
#   wires it to the events declared under `on:`. You can have multiple
#   workflows (e.g. a deploy.yml that triggers on tag pushes) — each is
#   independent.
#
# What this DOESN'T do (intentionally):
#   - No deploy. CI only verifies; CD is separate concern.
#   - No coverage upload (could add later — see comments at bottom).
#
# Lint is a BUG GATE, not a style gate (see eslint.config.mjs):
#   `npm run lint:ci` runs eslint with --quiet, so it fails ONLY on rules
#   configured as errors — chiefly `no-undef`, which catches the
#   undefined-reference class (e.g. the formatAddress-not-imported
#   regression that crashed quote/bill/PO/credit-note creation in prod).
#   Pre-existing style/purity issues are "warn" and don't block.
#   Requires eslint@9 — eslint@10 removed an API eslint-config-next@16 calls.

name: Test

# Events that trigger this workflow.
on:
  push:
    # feat/postgres-migration is here so the Postgres job actually runs while
    # the port is in progress. Without it CI first speaks at the PR to main,
    # which on a long-lived branch means dozens of commits of no feedback.
    # Drop it from this list once the branch merges.
    branches: [main, jeff-business-suite, feat/postgres-migration]
  pull_request:
    branches: [main, jeff-business-suite]

# A "job" is a unit of work that runs on its own fresh VM.
# We have one job called `test`. You can add more (e.g. `build:`, `e2e:`)
# and they'll run in parallel unless you use `needs:` to chain them.
jobs:
  test:
    name: Vitest suite
    runs-on: ubuntu-latest  # free Ubuntu runner; ~5s startup
    timeout-minutes: 30     # the Postgres suites are integration tests; 10 was sized for Mongo alone

    # ── Postgres, empty, created fresh for every run ──────────────────
    # The suites are `DATABASE_URL ? describe : describe.skip`, so without
    # this service every Postgres test SKIPPED and CI still went green —
    # the exact failure mode vitest.config.mjs warns about, on the branch
    # whose entire subject is the Postgres port.
    #
    # An empty database each run is the point, not a side effect: it means
    # `node app/db/migrate.mjs` below proves the migrations apply from
    # ZERO on every push. There is no production data to migrate (the
    # deployments start fresh), so "0001 through the latest applies to an
    # empty database" is the property that actually has to hold.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        # The job starts as soon as the container does; without a health
        # gate the migrate step races the server's first accept().
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── 1. Pull the repo at the commit being tested ────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Install Node ────────────────────────────────────────────
      # Node 22 LTS — minimum supported by Next.js 16. Cache npm so
      # subsequent runs skip the network round-trip for unchanged deps.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Cache the mongodb-memory-server binary ──────────────────
      # Without this, every CI run re-downloads ~65MB of Mongo binary
      # (the first-test-run pain you saw locally). With it, the binary
      # is cached and pulled from GitHub's cache backend in ~2 seconds.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          # Cache key embeds the Mongo version we pinned in setup.global.mjs.
          # If we bump that version, the cache invalidates and re-downloads.
          key: mongo-binaries-7.0.14-${{ runner.os }}

      # ── 4. Install dependencies ────────────────────────────────────
      # `npm ci` is strict — it requires a lockfile and refuses to
      # update it. Faster + more deterministic than `npm install` in CI.
      - name: Install dependencies
        run: npm ci

      # ── 4b. Repair the platform-native bindings npm left out ───────
      # THIS IS WHY CI HAS FAILED ON EVERY RUN SINCE THE BRANCH STARTED.
      #
      # `package-lock.json` is generated on a macOS arm64 machine, and npm
      # records only the optional platform packages it resolved there
      # (npm/cli#4828). For most native deps that is harmless here — esbuild
      # declares all 14 platforms explicitly so they are all in the lock — but
      # six are darwin-only, and one of them is load-bearing for the tests:
      #
      #   @rolldown/binding-darwin-arm64     <- vitest 4 runs on rolldown
      #   @next/swc-darwin-arm64
      #   @tailwindcss/oxide-darwin-arm64
      #   lightningcss-darwin-arm64
      #   @img/sharp-darwin-arm64
      #   @unrs/resolver-binding-darwin-arm64
      #
      # `npm ci` installs exactly the lock, so on ubuntu-latest it installs NO
      # rolldown binding at all and vitest dies before running a single test:
      # "Cannot find native binding … Cannot find module
      # '@rolldown/binding-linux-x64-gnu'". Install, lint and migrate all pass,
      # which is why the failure looked like a test failure and was not one.
      #
      # The version is read from what `npm ci` actually installed rather than
      # pinned here, so a vitest bump does not silently reintroduce this.
      #
      # The root fix is a platform-complete lockfile. Regenerating it is not a
      # drive-by change — a clean re-resolve moves other things — so it is left
      # for a deliberate dependency pass. Only rolldown is repaired because
      # only rolldown is needed to run tests; add to this list if a future step
      # builds the app, which needs swc, oxide and lightningcss.
      - name: Repair platform-native optional deps (npm/cli#4828)
        run: |
          ROLLDOWN_VERSION="$(node -p "require('rolldown/package.json').version")"
          echo "rolldown $ROLLDOWN_VERSION — installing its linux binding"
          npm install --no-save --no-audit --no-fund \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION"

      # ── 5. Lint (bug gate) ─────────────────────────────────────────
      # --quiet => only ERROR-level rules can fail the job. Catches
      # undefined references (no-undef) like the formatAddress regression.
      - name: Lint
        run: npm run lint:ci

      # ── 6. Apply migrations to the empty database ──────────────────
      # Invoked directly rather than through `npm run db:migrate`, because
      # that script is `node --env-file=.env …` and there is no .env in CI.
      # This step failing means a fresh deployment could not be stood up —
      # which nothing else in this pipeline would have caught.
      - name: Apply migrations from scratch
        run: node app/db/migrate.mjs
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test

      # ── 7. Run the test suite ──────────────────────────────────────
      # If any test fails, the step exits non-zero and the job fails.
      # GitHub then surfaces a ✗ on the commit / PR.
      #
      # Both URLs point at the superuser deliberately. globalSetup derives a
      # RESTRICTED role (app_test_role) from DIRECT_DATABASE_URL and hands the
      # workers that instead — a superuser bypasses RLS even under FORCE ROW
      # LEVEL SECURITY, and the isolation tests would pass vacuously (§9A).
      - name: Run tests
        run: npm test
        env:
          # Some Mongoose features check NODE_ENV. Keep it explicit.
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test

      # ── (Optional) Upload coverage ─────────────────────────────────
      # Uncomment once you decide where to send coverage. Codecov is
      # free for open-source; for private repos consider running
      # `npm run test:coverage` and uploading the report as an artifact.
      #
      # - name: Run coverage
      #   run: npm run test:coverage
      # - name: Upload coverage to artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage
      #     path: coverage/
