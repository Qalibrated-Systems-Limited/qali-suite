<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="qg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="44" height="44" rx="12" ry="12" fill="url(#qg)"/>
  <!-- Q circle (negative space) -->
  <circle cx="24" cy="22" r="11" fill="none" stroke="#18181B" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Q tail - dynamic diagonal -->
  <line x1="30" y1="28" x2="39" y2="37" stroke="#18181B" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Inner accent dot -->
  <circle cx="24" cy="22" r="2.5" fill="#18181B"/>
</svg>